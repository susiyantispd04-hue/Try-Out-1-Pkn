<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try Out TKA Pendidikan Pancasila SMA 2025</title>
<style>
:root{--bg:#f3f1ff;--card:#fff;--ink:#1e1b4b;--mut:#6b6a8f;--line:#e2e0f5;--pri:#6d28d9;--pri2:#2563eb;--ok:#16a34a;--okbg:#dcfce7;--warn:#f59e0b;--warnbg:#fef3c7;--no:#dc2626;--nobg:#fee2e2;--idle:#e5e7f2;--idleink:#4b4a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13112b;--card:#1d1a3d;--ink:#eeedff;--mut:#a5a3cf;--line:#34306a;--okbg:#0f3a22;--warnbg:#4a3508;--nobg:#4a1717;--idle:#2c2958;--idleink:#cfcdf5}}
:root[data-theme="dark"]{--bg:#13112b;--card:#1d1a3d;--ink:#eeedff;--mut:#a5a3cf;--line:#34306a;--okbg:#0f3a22;--warnbg:#4a3508;--nobg:#4a1717;--idle:#2c2958;--idleink:#cfcdf5}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.55}
.grad{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 6px 24px rgba(80,60,200,.08)}
h1{font-size:1.55rem;margin:0 0 4px}h2{margin:0 0 12px;font-size:1.15rem}
.hero{border-radius:22px;padding:28px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero p{margin:4px 0 0;opacity:.92}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tag{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px;font-size:.85rem}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem}
input[type=text]:focus{outline:none;border-color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.btn{border:0;border-radius:12px;padding:12px 20px;font-size:1rem;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2))}
.btn.ghost{background:var(--idle);color:var(--idleink)}.btn.warn{background:var(--warn);color:#3b2a00}.btn.go{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn:focus-visible{outline:3px solid var(--warn)}
.err{color:var(--no);font-size:.9rem;margin-top:8px;min-height:1.2em}
.top{position:sticky;top:0;z-index:5;border-radius:0 0 16px 16px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top small{opacity:.9;display:block}
.timer{font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:800;background:rgba(255,255,255,.2);padding:6px 14px;border-radius:12px}.timer.low{background:var(--no);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.6}}
.layout{display:grid;grid-template-columns:1fr 280px;gap:16px;margin-top:16px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.nav{order:-1}}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.badge{background:var(--warnbg);color:#92400e;padding:3px 12px;border-radius:99px;font-size:.8rem;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#fcd34d}}
.qtext{white-space:pre-line;font-size:1.05rem;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--pri)}.opt.sel{border-color:var(--pri);background:rgba(109,40,217,.12)}
.opt b{min-width:26px;height:26px;border-radius:50%;background:var(--idle);color:var(--idleink);display:grid;place-items:center;font-size:.85rem;flex:none}.opt.sel b{background:var(--pri);color:#fff}
table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:10px;text-align:left}th{background:var(--idle);color:var(--idleink)}td.c,th.c{text-align:center;width:78px}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.acts .btn{flex:1;min-width:110px}
.navg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nb{border:2px solid transparent;border-radius:10px;padding:9px 0;font-weight:700;cursor:pointer;background:var(--idle);color:var(--idleink)}
.nb.done{background:var(--ok);color:#fff}.nb.doubt{background:var(--warn);color:#3b2a00}.nb.cur{border-color:var(--pri);box-shadow:0 0 0 3px rgba(109,40,217,.35)}
.leg{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:.85rem;color:var(--mut)}.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-2px}
.ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;margin:0 auto}.ring div{width:134px;height:134px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;color:var(--ink)}
.ring strong{font-size:2.6rem;line-height:1}.ring span{font-size:.8rem;color:var(--mut)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}.info div{background:var(--bg);border-radius:12px;padding:10px 14px}.info small{color:var(--mut);display:block}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.stat{padding:6px 14px;border-radius:99px;font-weight:700;font-size:.9rem}
.rv{border-left:6px solid var(--idle);margin-bottom:14px}.rv.ok{border-color:var(--ok)}.rv.bad{border-color:var(--no)}.rv.part{border-color:var(--warn)}
.ans{padding:8px 12px;border-radius:10px;margin:6px 0;font-size:.95rem}.ans.k{background:var(--okbg)}.ans.u{background:var(--nobg)}.ans.n{background:var(--idle)}
.exp{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:.95rem}
.note{font-size:.82rem;color:var(--mut);margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.6);display:grid;place-items:center;z-index:20;padding:16px}
.hide{display:none!important}
@media print{.top,.acts,.noprint{display:none!important}body{background:#fff}}
</style>
</head>

<script>
const QUESTIONS=[
{t:"s",q:"Kepentingan pedagang dan pengguna jalan sangat berbeda; pedagang ingin meningkatkan pendapatan dan menjual produk, sementara pengguna jalan membutuhkan kelancaran dan keamanan pergerakan di jalan umum. Namun, berjualan di fasilitas jalan seperti trotoar atau badan jalan dapat mengganggu fungsi jalan, membahayakan keselamatan, dan melanggar hukum.\n\nPeran Pancasila dalam memastikan bahwa semua individu memiliki akses yang sama terhadap keadilan berdasarkan ilustrasi tersebut adalah ....",o:["memberi panduan kepada pedagang cara berjualan yang dapat menjamin hak mendapatkan penghidupan yang layak","mengarahkan pedagang dan pengguna jalan agar mengutamakan kepentingan bersama setelah kepentingan pribadi terlaksana","mengingatkan pentingnya kebersamaan dalam menjamin rasa keadilan dan keseimbangan antara hak dan kewajiban","mengupayakan agar kegiatan pedagang mengutamakan kepentingan pengguna jalan untuk kenyamanan dan ketertiban","menyelaraskan dua kepentingan untuk menciptakan harmoni sosial yang mengedepankan keseimbangan hak dan kewajiban"],a:[2],e:"Sila Kelima (keadilan sosial) menuntut keseimbangan hak dan kewajiban. Pancasila berperan mengingatkan bahwa kebersamaan menjamin keadilan bagi semua pihak: pedagang berhak mencari nafkah, pengguna jalan berhak atas jalan yang aman, dan keduanya berkewajiban saling menghormati."},
{t:"s",q:"Pasal 27 ayat (3) UUD NRI Tahun 1945 menyatakan bahwa \"Setiap warga negara berhak dan wajib ikut serta dalam upaya pembelaan negara.\"\n\nBerdasarkan ilustrasi, hak warga negara yang mencerminkan pasal tersebut yaitu warga negara berhak ....",o:["mengikuti kegiatan sosial dan wajib mematuhi peraturan yang ditetapkan oleh pemerintah dalam lingkungannya","memperoleh pendidikan dan wajib menerapkan nilai-nilai kebangsaan dalam kehidupan sehari-hari","menyampaikan aspirasi kepada pemerintah dan wajib menaati aturan hukum yang berlaku di masyarakat","terlibat dalam kegiatan kemasyarakatan dan wajib ikut menjaga ketertiban serta ketentraman lingkungan sekitarnya","memperoleh perlindungan negara dan wajib ikut berpartisipasi menjaga keamanan serta kedaulatan bangsa"],a:[4],e:"Pasal 27 ayat (3) mengatur hak dan kewajiban bela negara. Hak warga negara adalah memperoleh perlindungan negara, sedangkan kewajibannya ikut berpartisipasi menjaga keamanan dan kedaulatan bangsa."},
{t:"m",q:"Pemerintah terus mendorong harmoni dalam keberagaman melalui berbagai program. Salah satunya adalah Festival Toleransi dan Budaya Pelajar yang melibatkan siswa SMA dari berbagai daerah. Kegiatan ini meliputi pertukaran budaya, pameran kearifan lokal, dan diskusi lintas suku, agama, serta bahasa.\n\nBerdasarkan informasi tersebut, pernyataan mana saja yang menunjukkan sikap positif sebagai modal sosial untuk pembangunan nasional?",o:["terlibat secara aktif dalam pertukaran budaya dan belajar mengenali keunikan budaya yang lain","menjalin komunikasi secara wajar dengan tetap menjaga kenyamanan dalam keberagaman budaya","menghormati simbol-simbol dari berbagai adat dan agama saat berkunjung ke daerah-daerah lain","membagikan pengalaman kegiatan lintas budaya di media sosial sebagai inspirasi untuk masyarakat","menyampaikan pendapat dengan hati-hati saat melakukan diskusi agar keputusan segera terwujud"],a:[0,1,2,3],e:"Modal sosial dibangun dari sikap terbuka, saling menghormati, dan komunikasi yang baik antarbudaya. Keterlibatan aktif, komunikasi wajar, penghormatan simbol adat/agama, dan berbagi pengalaman lintas budaya memperkuat harmoni. Pilihan terakhir menekankan 'keputusan segera terwujud', bukan semangat dialog dan saling memahami."},
{t:"s",q:"Penyebaran paham radikalisme di media sosial untuk merubah ideologi negara semakin marak terjadi. Hal ini memengaruhi generasi muda dan menciptakan konflik horizontal di masyarakat.\n\nUpaya terbaik untuk melindungi keutuhan NKRI dari dampak tersebut adalah...",o:["mengadakan dialog terbuka dengan kelompok radikal untuk mencari titik temu dan mengurangi konflik ideologi","memperkuat pendidikan Pancasila dan literasi digital di sekolah serta melibatkan tokoh agama dalam edukasi masyarakat","meningkatkan pengawasan ketat terhadap aktivitas media sosial dan memberikan teguran bagi penyebar konten radikal","mengorganisir kampanye nasional anti radikalisme melalui berbagai platform media untuk membentuk opini publik","membentuk forum diskusi antargenerasi untuk membahas perbedaan pandangan ideologi secara demokratis"],a:[1],e:"Upaya paling mendasar dan berkelanjutan adalah pencegahan melalui pendidikan Pancasila dan literasi digital, sehingga generasi muda kebal terhadap paham radikal, dengan dukungan tokoh agama dan masyarakat."},
{t:"s",q:"Indonesia sebagai negara kepulauan yang multietnis menghadapi tantangan disintegrasi yang sering dipicu oleh isu ketidakadilan, diskriminasi, dan penyebaran hoaks.\n\nCara warga negara dalam mengatasi tantangan tersebut dapat dilakukan dengan ....",o:["mengajak masyarakat menjaga budaya lokal dengan membatasi pengaruh budaya luar yang masuk","menyebarkan informasi yang benar dan membangun dialog antarkelompok untuk mencegah konflik","mendorong pembentukan kelompok sosial yang terdiri dari warga dengan latar belakang yang sama","berpartisipasi dalam diskusi di media sosial dengan menyuarakan pandangan kelompok minoritas","meminimalkan pernyataan atau aktivitas yang dapat menimbulkan gesekan antarkelompok di masyarakat"],a:[1],e:"Hoaks dan diskriminasi dilawan dengan informasi yang benar serta dialog antarkelompok. Cara ini aktif mencegah konflik, tidak sekadar menghindari gesekan atau membatasi diri pada kelompok sejenis."},
{t:"s",q:"Terjadi perdebatan sengit di masyarakat dan parlemen terkait wacana amandemen UUD 1945 di mana sebagian pihak mengusulkan agar pemilihan presiden dikembalikan ke MPR, sedangkan lainnya ingin mempertahankan sistem pemilihan langsung oleh rakyat. Ketegangan ini menimbulkan kekhawatiran akan mundurnya demokrasi di Indonesia.\n\nBerdasarkan ilustrasi, pentingnya Pancasila untuk memecahkan masalah tersebut karena ....",o:["menjadi dasar mempertimbangkan setiap perubahan agar tetap menjamin kedaulatan rakyat dan keadilan sosial secara seimbang","digunakan sebagai alat hukum tertinggi Indonesia agar perubahan aturan tidak menyalahi sistem pemerintahan yang sudah berlaku","menjadi acuan teknis lembaga legislatif di Indonesia dalam menentukan batasan perubahan agar tidak melewati kewenangan politik","digunakan oleh lembaga eksekutif agar pelaksanaan pemerintahan di Indonesia tetap stabil di tengah konflik politik yang terjadi","dijadikan dasar keputusan oleh lembaga yudikatif untuk menilai apakah usulan perubahan tersebut sesuai kepentingan negara"],a:[0],e:"Pancasila adalah dasar negara dan sumber nilai: setiap perubahan konstitusi harus dipertimbangkan agar tetap menjamin kedaulatan rakyat (Sila 4) dan keadilan sosial (Sila 5), bukan sekadar alat teknis atau milik satu lembaga."},
{t:"s",q:"Salah satu bentuk kerja sama antara pemerintah pusat dan pemerintah daerah adalah dalam hal Penanggulangan Kemiskinan. Kerja sama dalam penanggulangan kemiskinan melibatkan pemerintah pusat yang memberikan kebijakan dan program, sementara pemerintah daerah melaksanakan program tersebut di tingkat daerah termasuk bantuan sosial, pelatihan, dan pengembangan usaha mikro.\n\nBentuk kerja sama ini dilakukan karena ...",o:["Pemerintah pusat mengembangkan program-program yang dapat diimplementasikan oleh pemerintah daerah, seperti program pelatihan kerja, bantuan sosial, dan pengembangan ekonomi lokal","Pemerintah daerah dapat mengembangkan ekonomi lokal dengan menciptakan lapangan kerja, mendukung usaha kecil dan menengah, serta meningkatkan infrastruktur","Pemerintah daerah dapat menyediakan program bantuan sosial seperti bantuan pangan, bantuan biaya pendidikan, dan bantuan kesehatan untuk masyarakat miskin.","Pemerintah daerah dapat mengidentifikasi dan memetakan kemiskinan di daerahnya, sehingga dapat mengajukan permohonan bantuan kepada pemerintah pusat untuk mengatasinya","Pemerintah daerah dapat meningkatkan kapasitas masyarakat melalui pelatihan dan pendidikan, sehingga masyarakat dapat meningkatkan keterampilan dan kemampuan mereka"],a:[0],e:"Dalam hubungan pusat-daerah, pusat menetapkan kebijakan dan program nasional, sedangkan daerah melaksanakannya sesuai kondisi setempat. Kerja sama dilakukan karena masalah kemiskinan perlu penanganan terpadu: program pusat dapat diimplementasikan oleh daerah yang paling memahami kebutuhan warganya."},
{t:"m",q:"Keberagaman bangsa Indonesia merupakan salah satu kekuatan dan kekayaan bangsa, namun juga dapat menjadi tantangan dalam membangun kesatuan dan persatuan. Oleh karena itu, penting untuk meningkatkan sikap toleransi, saling menghormati, dan kerja sama antaretnis dan agama.\n\nBerdasarkan ilustrasi tersebut, pernyataan mana saja yang menjelaskan tujuan integrasi nasional dalam bingkai Bhinneka Tunggal Ika?",o:["Integrasi bangsa Indonesia bertujuan untuk membangun kesatuan dan persatuan bangsa, sehingga masyarakat Indonesia dapat hidup harmonis dan sejahtera","Integrasi bangsa Indonesia bertujuan untuk meningkatkan kualitas hidup masyarakat Indonesia melalui pembangunan ekonomi, pendidikan, dan kesehatan","Integrasi Bangsa Indonesia bertujuan untuk menjadikan bangsa Indonesia menjadi Negara yang kuat dan bangsa yang disegani dalam percaturan internasional","Integrasi yang berasal dari kebinekaan bangsa Indonesia bertujuan meningkatkan kerjasama antarpemeluk agama dan suku bangsa sehingga tercipta bangsa yang besar","Integrasi nasional Indonesia bertujuan mengembangkan identitas nasional yang kuat dan bangga, sehingga masyarakat Indonesia dapat memiliki rasa kebanggaan dan cinta tanah air"],a:[0,3,4],e:"Tujuan integrasi nasional dalam bingkai Bhinneka Tunggal Ika adalah menyatukan keberagaman: membangun persatuan agar hidup harmonis, meningkatkan kerja sama antarpemeluk agama dan suku, serta menguatkan identitas nasional dan cinta tanah air. Peningkatan kualitas hidup dan citra internasional adalah dampak/hasil, bukan tujuan utama integrasi."},
{t:"s",q:"Panca gatra adalah aspek sosial kemasyarakatan dalam wawasan nusantara yang bersifat dinamis meliputi ideologi, politik, ekonomi, sosial budaya dan pertahanan keamanan. Gatra ekonomi sebagai salah satu aspek dalam wawasan nusantara merujuk pada aspek ekonomi yang menjadi bagian integral dari cara pandang bangsa Indonesia terhadap wilayah dan potensi negaranya. Wawasan nusantara dalam bidang ekonomi juga mengamanatkan pelaksanaan demokrasi ekonomi.\n\nPentingnya hal tersebut dalam menjaga keutuhan NKRI adalah ....",o:["mewujudkan pembangunan yang menjamin terwujudnya pemerataan pendapatan","mendorong untuk terus mengembangkan kehidupan ekonomi yang kuat dan mandiri","menekankan pentingnya eksploitasi dan eksploitasi potensi ekonomi antardaerah di Indonesia","melibatkan potensi dan partisipasi dari seluruh masyarakat, bukan hanya pihak tertentu","mengeksplorasi seluruh kekayaan alam dan potensi ekonomi strategis Indonesia"],a:[3],e:"Demokrasi ekonomi berarti ekonomi dari, oleh, dan untuk rakyat. Dalam wawasan nusantara, seluruh potensi dan partisipasi masyarakat dilibatkan sehingga tidak ada daerah atau kelompok yang tertinggal. Ini menjaga persatuan dan keutuhan NKRI."},
{t:"s",q:"Dalam negara demokrasi, pemilihan umum merupakan sarana utama mewujudkan kedaulatan rakyat. Pemilu merupakan proses penting dalam sistem demokrasi yang memungkinkan rakyat untuk memilih wakil-wakil mereka dalam pemerintahan.\n\nPerilaku yang mencerminkan hak asasi manusia sesuai dengan sila keempat Pancasila berdasarkan ilustrasi tersebut adalah ....",o:["menggunakan hak pilih sesuai dengan arah kebijakan dari partai politik","menghormati perbedaan pendapat dan pilihan politik dalam masyarakat","berpartisipasi aktif dengan cara mengikuti kampanye seluruh partai politik","mengikuti debat dalam pemilu untuk menilai strategi pemenangan para kandidat","menerima hasil dari setiap tahapan pemilu karena pelaksanaannya di awasi negara"],a:[1],e:"Sila keempat menekankan kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan. Menghormati perbedaan pendapat dan pilihan politik mencerminkan penghargaan atas hak asasi orang lain dalam berdemokrasi."},
{t:"s",q:"Dalam pelaksanaan Pilkada Serentak tahun 2024 lalu, terjadi perselisihan hasil penghitungan suara salah satu daerah. Dua pasangan calon saling mengklaim kemenangan, sementara rekapitulasi suara oleh KPU daerah dituding tidak transparan. Salah satu pasangan calon kemudian menggugat hasil Pilkada tersebut karena diduga terjadi kecurangan yang bersifat terstruktur, sistematis, dan masif (TSM) yang dapat memengaruhi hasil akhir pemilihan.\n\nBerdasarkan sistem ketatanegaraan Indonesia, cara menyelesaikan permasalahan tersebut sesuai kewenangan lembaga negara adalah ...",o:["Presiden menetapkan peraturan pemerintah untuk mengatur ketentuan penyelesaian perbedaan penghitungan suara","Mahkamah Konstitusi melaksanakan kewenangannya dengan memutus perselisihan tentang hasil pemilukada","Komisi Pemilihan Umum membuat aturan internal tentang penyelesaian perselisihan hasil perhitungan suara pemilukada","Badan Pengawas Pemilihan Umum memerintahkan dilakukannya pemungutan suara ulang untuk kepastian hasil","DPRD bersama Pemerintah Daerah membuat peraturan daerah yang mengatur pemilukada yang lebih lengkap"],a:[1],e:"Kewenangan Mahkamah Konstitusi menurut UUD NRI 1945 (Pasal 24C) antara lain memutus perselisihan tentang hasil pemilihan umum, termasuk sengketa hasil pilkada."},
{t:"s",q:"Diskriminasi adalah perlakuan yang tidak adil terhadap seseorang atau kelompok berdasarkan perbedaan suku, agama, ras, jenis kelamin, atau status sosial. Apabila dibiarkan, diskriminasi dapat memicu konflik dan menjadi ancaman serius bagi integrasi nasional Indonesia.\n\nBerdasarkan ilustrasi, upaya yang perlu dilakukan untuk menghadapi ancaman tersebut agar integrasi nasional tetap terjaga adalah ....",o:["mendorong tumbuhnya semangat memperjuangkan kebebasan individu dalam kehidupan bernegara","mengajak setiap individu untuk saling mengakui sebagai makhluk yang memiliki kebebasan dan merdeka","mengutamakan dialog antarwarga untuk memperkuat rasa saling pengertian dan mencegah prasangka","menempatkan orang lain sesuai posisi sosialnya sebagai bagian dari tatanan masyarakat yang teratur","menumbuhkan sikap saling menghormati karena setiap manusia memiliki harkat dan martabat yang sama"],a:[2],e:"Diskriminasi bersumber dari prasangka dan kurangnya saling pengertian. Dialog antarwarga memperkuat pemahaman dan mencegah prasangka sehingga persatuan tetap terjaga. Pilihan lain bersifat nilai umum atau justru membenarkan pembedaan posisi sosial."},
{t:"k",q:"Globalisasi ekonomi mendorong masuknya berbagai produk luar negeri ke pasar Indonesia. Apabila tidak disikapi dengan bijak, hal ini dapat menurunkan daya saing produk lokal dan mengancam perekonomian nasional.\n\nBerdasarkan ilustrasi, pilih Benar atau Salah dari setiap pernyataan berikut yang menunjukkan peran warga negara dalam menjaga keutuhan NKRI berdasarkan dinamika tersebut!",s:["berperan sebagai konsumen yang mendukung produk dalam negeri untuk memperkuat perekonomian nasional","berpartisipasi dalam kegiatan ekonomi yang mendorong daya saing bangsa di tengah arus globalisasi","berpatisipasi dengan membeli produk-produk dalam negeri karena memiliki harga lebih murah"],a:[true,true,false],e:"Pernyataan 1 dan 2 BENAR: mendukung produk dalam negeri dan ikut meningkatkan daya saing merupakan wujud bela negara di bidang ekonomi. Pernyataan 3 SALAH: alasan 'harga lebih murah' bukan didasari kesadaran menjaga perekonomian nasional, melainkan pertimbangan pribadi semata."},
{t:"s",q:"Bunyi sila kedua dan keempat Pancasila yaitu \"Kemanusiaan yang Adil dan Beradab\" dan \"Kerakyatan yang Dipimpin oleh Hikmat Kebijaksanaan dalam Permusyawaratan Perwakilan\".\n\nPerilaku yang berhubungan dengan kedua sila Pancasila tersebut adalah ...",o:["menghormati perbedaan pendapat teman dan bekerja sama untuk menyelesaikan tugas kelompok dengan baik","memberikan perlakuan yang sama kepada semua orang tanpa membeda-bedakan latar belakang suku dan agama","bekerja sama dengan warga lain untuk membangun fasilitas umum yang dapat dinikmati oleh seluruh masyarakat","memberikan bantuan kepada korban banjir suatu daerah berdasarkan hasil musyawarah seluruh warga kampung","menghormati hak asasi manusia dengan bersikap adil dan beradab kepada sesama antarumat beragama"],a:[0],e:"Menghormati perbedaan pendapat mencerminkan sila kedua (menghargai martabat sesama secara beradab), sedangkan bekerja sama menyelesaikan tugas bersama mencerminkan semangat musyawarah dan kerja sama pada sila keempat."},
{t:"k",q:"Mahkamah Konstitusi (MK) adalah lembaga negara yang mempunyai wewenang sebagaimana diatur dalam Undang-Undang Dasar Negara RI Tahun 1945.\n\nKlik pada pilihan Benar atau Salah dari setiap pernyataan berikut berkaitan dengan Wewenang Mahkamah Konstitusi!",s:["memutuskan pendapat DPR mengenai dugaan pelanggaran oleh Presiden dan Wakil Presiden","menguji peraturan perundang-undangan di bawah undang-undang terhadap undang-undang","mengganti dan sekaligus melantik Presiden dan/atau Wakil Presiden dalam masa jabatannya"],a:[true,false,false],e:"Wewenang MK (Pasal 24C UUD 1945): menguji undang-undang terhadap UUD, memutus sengketa kewenangan lembaga negara, membubarkan partai politik, memutus perselisihan hasil pemilu, dan memutus pendapat DPR tentang dugaan pelanggaran Presiden/Wapres. Pernyataan 2 SALAH karena pengujian peraturan di bawah undang-undang terhadap undang-undang adalah wewenang Mahkamah Agung. Pernyataan 3 SALAH karena pelantikan/pemberhentian Presiden adalah wewenang MPR."},
{t:"k",q:"Bangsa Indonesia adalah bangsa yang memiliki keberagaman suku, agama, bahasa, adat istiadat, dan budaya yang hidup berdampingan. Kebinekaan dapat menjadi fondasi kokoh yang menopang persatuan dan kesatuan bangsa. Namun adanya perbedaan juga dapat menjadi ancaman persatuan dan kesatuan.\n\nKlik Benar atau Salah dari setiap pernyataan berikut yang menunjukkan upaya menjaga integrasi nasional dalam bingkai kebhinekaan!",s:["menghormati dan melindungi hak asasi manusia untuk semua warga negara, tanpa membedakan latar belakang budaya, agama, atau suku bangsa","mengawasi dan menangani konflik yang berpotensi mengancam integrasi nasional, serta meningkatkan kerja sama antarlembaga dan masyarakat","meningkatkan dialog dan komunikasi antarkelompok masyarakat untuk memperkuat persatuan bangsa dengan menyesuaikan perkembangan budaya lain"],a:[true,true,true],e:"Ketiga pernyataan merupakan upaya menjaga integrasi nasional: menghormati HAM tanpa diskriminasi, mencegah dan menangani konflik bersama-sama, serta memperluas dialog dan komunikasi antarkelompok agar saling memahami dan terbuka terhadap perkembangan budaya lain."},
{t:"k",q:"Perubahan iklim dan lingkungan merupakan salah satu bagian dalam perkembangan masyarakat global yang dapat mengancam keberlangsungan hidup manusia dan ekosistem serta menciptakan ketidakstabilan sosial, ekonomi dan politik yang kerap memunculkan terjadinya konflik dalam masyarakat.\n\nKlik pada pilihan Benar atau Salah dari setiap pernyataan berikut yang menunjukkan bukti bahwa Bhinneka Tunggal Ika dapat mengatasi ancaman sebagaimana ilustrasi diatas!",s:["Bhinneka Tunggal Ika merupakan semboyan persatuan dan kesatuan yang mengakui persamaan suku, agama, bahasa, dan budaya serta identitas nasional dengan menghilangkan segala bentuk perbedaan","Bhinneka Tunggal Ika meningkatkan penghormatan dan penghargaan terhadap perbedaan, sehingga dapat mengurangi konflik dan meningkatkan kesatuan dan persatuan sebagai bagian masyarakat global","Bhinneka Tunggal Ika meningkatkan kesadaran terhadap keberagaman dan kesatuan, sehingga dapat meningkatkan partisipasi dan kontribusi masyarakat dalam membangun masyarakat global yang dinamis"],a:[false,true,true],e:"Pernyataan 1 SALAH: Bhinneka Tunggal Ika mengakui dan menghargai perbedaan, bukan menghilangkannya (berbeda-beda tetapi tetap satu). Pernyataan 2 dan 3 BENAR: penghormatan terhadap perbedaan dan kesadaran akan keberagaman mengurangi konflik serta mendorong partisipasi dan kontribusi dalam masyarakat global."},
{t:"s",q:"Warga di sebuah lingkungan perumahan hidup berdampingan dalam keberagaman agama, budaya, dan latar belakang sosial. Mereka saling menghargai, aktif dalam kegiatan sosial bersama, dan menjaga ketertiban dengan mematuhi aturan yang berlaku.\n\nBerdasarkan ilustrasi, nilai Pancasila yang paling tepat telah diterapkan pada kondisi tersebut adalah ....",o:["Nilai Ketuhanan, karena setiap warga dapat menjalankan ibadah sesuai agama dan keyakinannya","Nilai Kemanusiaan, karena masyarakat saling membantu tanpa memandang latar belakangnya","Nilai Persatuan, karena perbedaan yang ada tidak menjadi penghalang untuk hidup rukun dan harmonis","Nilai Persatuan, karena warga berpartisipasi dalam kegiatan sosial sesuai peran kelompok budayanya","Nilai Keadilan Sosial, karena semua warga mendapatkan hak dan fasilitas secara merata tanpa kecuali"],a:[2],e:"Inti ilustrasi adalah hidup berdampingan secara rukun dan harmonis meskipun berbeda agama, budaya, dan latar belakang. Ini mencerminkan nilai Persatuan (Sila Ketiga). Pilihan D keliru karena partisipasi tidak dibagi 'sesuai peran kelompok budaya', melainkan bersama-sama."},
{t:"s",q:"Sekelompok pedagang kecil mengalami masalah karena tempat mereka mencari nafkah tiba-tiba dilarang digunakan. Hal ini terjadi tanpa kesepakatan ganti rugi, sehingga mereka merasa telah terjadi pelanggaran hak dan pengingkaran kewajiban untuk saling menghormati kepentingan masing-masing.\n\nBerdasarkan ilustrasi, solusi untuk mengatasi pelanggaran tersebut yaitu ....",o:["mengirim perwakilan pedagang untuk menyampaikan usulan agar memperoleh tempat pengganti untuk berjualan","mengumpulkan dukungan dari elemen masyarakat sebagai upaya mempertahankan haknya untuk berjualan","melakukan mediasi sehingga para pihak memahami hak dan kewajibannya yang melandasi kepentingannya","mengajukan advokasi kepada lembaga bantuan hukum untuk memastikan para pedagang berada di pihak yang benar","mewakilkan kepada lembaga swadaya masyarakat untuk membantu memperjuangkan hak-hak sebagai pengguna lahan"],a:[2],e:"Mediasi mempertemukan kedua pihak agar saling memahami hak dan kewajiban masing-masing sehingga tercapai kesepakatan (misalnya ganti rugi atau tempat pengganti). Solusi ini sesuai dengan akar masalah pada ilustrasi, yaitu tidak adanya kesepakatan dan saling menghormati kepentingan."},
{t:"s",q:"Kehidupan suku bangsa di Indonesia sangat kaya akan keberagaman, dipengaruhi oleh faktor geografis dan sejarah. Indonesia memiliki lebih dari 1.340 suku bangsa yang tersebar di berbagai pulau, masing-masing dengan bahasa, tradisi, dan adat istiadat yang unik.\n\nBerdasarkan ilustrasi, tantangan yang dihadapi dalam menjaga integrasi nasional dalam bingkai \"Bhinneka Tunggal Ika\" adalah ....",o:["adanya ketimpangan kehidupan yang terjadi dalam masyarakat","munculnya sikap sukuisme dalam kehidupan bermasyarakat","hadirnya perasaan rendah diri suku tertentu dalam masyarakat","terjadinya kepunahan suku tertentu akibat kesenjangan sosial","munculnya perilaku modernisme suku tertentu yang berlebihan"],a:[1],e:"Dengan banyaknya suku bangsa, tantangan utama integrasi adalah sukuisme (fanatisme berlebihan terhadap suku sendiri) yang dapat memicu prasangka, diskriminasi, dan konflik antarsuku."},
{t:"s",q:"Dalam kegiatan kerja bakti membersihkan lingkungan sekolah, Dimas yang berasal dari Papua, Siti dari Jawa, dan Andi dari Sulawesi bekerja bersama. Mereka membagi tugas sesuai kemampuan, saling membantu, dan mengambil keputusan melalui musyawarah tanpa mempersoalkan perbedaan asal daerah.\n\nNilai Pancasila yang paling tepat tercermin pada kegiatan tersebut adalah ....",o:["Sila Pertama, karena kegiatan dilakukan dengan rasa syukur kepada Tuhan Yang Maha Esa","Sila Ketiga, karena siswa dari berbagai daerah bersatu dan bekerja sama demi kepentingan bersama tanpa mempersoalkan perbedaan","Sila Keempat, karena keputusan kegiatan sepenuhnya ditentukan oleh ketua kelompok","Sila Kelima, karena hasil kegiatan dibagikan menjadi milik pribadi masing-masing siswa","Sila Kedua, karena seluruh siswa diwajibkan mengikuti kegiatan dengan sanksi yang tegas"],a:[1],e:"Siswa dari daerah berbeda yang bekerja sama dan saling membantu demi kepentingan bersama menunjukkan nilai persatuan (Sila Ketiga), sekaligus semangat gotong royong. Pilihan C keliru karena keputusan diambil melalui musyawarah, bukan ditentukan sepihak. Pilihan D dan E tidak sesuai dengan ilustrasi."},
{t:"k",q:"Perkembangan global menyebabkan Pancasila menjadi representasi dari keberagaman masyarakat dunia. Pancasila dengan nilai-nilai toleransi, persatuan, dan keadilan, menjadi solusi universal dalam mengatasi tantangan perbedaan budaya dan agama di dunia. Kondisi tersebut berpotensi menjadikan bangsa Indonesia sebagai role model dalam mempromosikan kerukunan dan harmoni dari keberagaman masyarakat dunia.\n\nKlik pada pilihan benar atau salah dari setiap pernyataan berikut terkait fungsi dari diterapkannya Pancasila dalam pergaulan kehidupan global berdasarkan ilustrasi tersebut!",s:["Pancasila dapat menjadi landasan untuk meningkatkan hubungan internasional yang harmonis dan berkeadilan","Pancasila dapat menjadi landasan untuk membangun kerja sama internasional yang efektif dan berkeadilan","Implementasi Pancasila di era global dapat meningkatkan derajat Indonesia sebagai bangsa yang unggul di dunia"],a:[true,true,true],e:"Nilai toleransi, persatuan, dan keadilan dalam Pancasila relevan secara universal. Ketiganya berfungsi sebagai landasan hubungan dan kerja sama internasional yang harmonis dan berkeadilan, sekaligus mengangkat posisi Indonesia sebagai role model kerukunan."},
{t:"s",q:"Pasal 27 ayat (2) UUD NRI Tahun 1945 menyatakan bahwa tiap-tiap warga negara berhak atas pekerjaan dan penghidupan yang layak bagi kemanusiaan.\n\nTantangan yang dihadapi dalam mengimplementasikan pasal tersebut adalah ....",o:["penyusunan regulasi di bidang ketenagakerjaan yang membutuhkan waktu yang lama","adanya keterbatasan akses terhadap pekerjaan akibat ketidaksetaraan dan infrastruktur","tingkat keterampilan dan pendidikan di kalangan pencari kerja yang merata dan setara","adanya perbedaan standar kualitas pekerja yang berbeda-beda dari pemberi kerja","lemahnya perlindungan hukum yang diberikan oleh negara kepada pekerja anak"],a:[1],e:"Hak atas pekerjaan dan penghidupan layak terhambat oleh keterbatasan akses pekerjaan akibat ketimpangan antardaerah dan kurang memadainya infrastruktur. Pilihan C keliru karena keterampilan yang 'merata dan setara' justru bukan tantangan."},
{t:"s",q:"Reog Ponorogo merupakan bagian tak terpisahkan dari kehidupan budaya masyarakat Ponorogo, Jawa Timur. Seiring perkembangannya, Reog tidak hanya menjadi simbol budaya masyarakat Ponorogo, tetapi juga bagian dari identitas budaya nasional Indonesia. Pada tahun 2024, Reog Ponorogo resmi diakui sebagai warisan budaya takbenda oleh UNESCO, sebagai langkah penting dalam pelestarian warisan budaya bangsa dan menjadi modal sosial pembangunan Indonesia.\n\nAlasan pelestarian Reog Ponorogo menjadi modal sosial pembangunan Indonesia adalah ....",o:["tradisi lokal memperkuat promosi pariwisata untuk peningkatan ekonomi nasional","identitas budaya daerah yang diakui secara internasional mendatangkan modal pembangunan","kebudayaan menjadi identitas pembangunan bangsa di tengah maraknya gempuran budaya asing","pembangunan nasional membutuhkan identitas budaya lokal dalam menentukan prioritas pembangunan","pengakuan warisan budaya oleh UNESCO dapat menjadi modal pembangunan yang diakui dunia internasional"],a:[2],e:"Modal sosial berkaitan dengan nilai, identitas, dan kebersamaan yang memperkuat masyarakat. Budaya seperti Reog menjadi identitas bangsa yang menumbuhkan kebanggaan dan persatuan di tengah gempuran budaya asing, sehingga mendukung pembangunan. Pilihan lain lebih menonjolkan manfaat ekonomi atau pengakuan internasional."},
{t:"s",q:"Pemerintah Indonesia mengadakan kegiatan Festival Budaya Nusantara yang melibatkan berbagai komunitas dari seluruh provinsi. Kegiatan ini mencakup pameran seni, pertunjukan tradisional, serta diskusi tentang keberagaman budaya Indonesia.\n\nAlasan kegiatan tersebut dapat memperkukuh persatuan dan kesatuan bangsa adalah ....",o:["memperkenalkan produk lokal untuk meningkatkan perekonomian setiap daerah","mengedepankan keberagaman budaya Indonesia yang mempererat hubungan antarwarga negara","menciptakan peluang kerja baru untuk masyarakat yang terlibat dalam pameran dan pertunjukan","memberi kesempatan kepada wisatawan lokal dan asing untuk menikmati budaya Indonesia","promosi pariwisata lokal di setiap daerah untuk menarik lebih banyak wisatawan domestik"],a:[1],e:"Festival budaya mempertemukan warga dari berbagai daerah, sehingga saling mengenal dan menghargai keberagaman. Interaksi ini mempererat hubungan antarwarga dan memperkukuh persatuan. Manfaat ekonomi dan pariwisata hanyalah dampak tambahan."},
{t:"s",q:"Dinamika masyarakat multikultural di Indonesia merupakan interaksi kompleks antarberbagai kelompok etnis, budaya, agama, dan sistem nilai, yang menghasilkan berbagai tantangan. Salah satu permasalahan yang dihadapi masyarakat multikultural di Indonesia adalah konflik antaragama.\n\nPeran Pancasila sebagai ideologi negara yang menjadi pemersatu dalam kehidupan berbangsa berdasarkan ilustrasi di atas adalah ...",o:["sebagai perekat hubungan umat beragama mayoritas dan minoritas serta pemerintah dalam kehidupan bernegara","menjadi pendorong adanya dialog sesama agama untuk meningkatkan kebersamaan umat dan mengurangi rasa curiga","menjadi dasar dalam melihat adanya perbedaan paham dari berbagai agama dan aliran kepercayaan dalam masyarakat","merupakan sarana untuk menguji kepekaan sosial dan rasa solidaritas kelompok dari umat beragama dalam masyarakat","sebagai dasar untuk menghargai dan menghormati perayaan hari-hari besar berbagai agama dalam masyarakat"],a:[0],e:"Sebagai ideologi pemersatu, Pancasila (terutama Sila Pertama dan Ketiga) berperan merekatkan hubungan umat beragama, baik mayoritas maupun minoritas, bersama pemerintah dalam kehidupan bernegara sehingga konflik antaragama dapat dicegah."},
{t:"s",q:"Seorang pengusaha membuang limbah pabrik ke sungai yang mengalir di dekat pemukiman warga. Akibatnya, air menjadi tercemar dan banyak warga mengalami gangguan kesehatan. Meskipun masyarakat sudah melaporkan hal ini kepada pihak berwenang, proses hukum berjalan sangat lambat. Bahkan, muncul kabar bahwa perusahaan tersebut memberikan \"uang pelican\" agar kasusnya tidak diproses lebih lanjut. Warga menjadi kecewa dan kehilangan kepercayaan terhadap lembaga penegak hukum.\n\nBerdasarkan ilustrasi tersebut, tantangan utama dalam penegakan hukum yang ditunjukkan adalah....",o:["kurangnya partisipasi masyarakat dalam kegiatan pemeliharaan lingkungan hidup","lemahnya perlindungan hukum kepada terduga pelaku pencemaran lingkungan","maraknya pengaruh kekuasaan dan praktik suap dalam menjalankan proses hukum","maraknya pelanggaran hukum yang diselesaikan secara kekeluargaan","rendahnya kesadaran pengusaha dalam menjaga kelestarian lingkungan alam"],a:[2],e:"Kata kunci 'uang pelicin' agar kasus tidak diproses menunjukkan adanya suap dan pengaruh kekuasaan/uang yang menghambat proses hukum. Inilah tantangan utama penegakan hukum pada ilustrasi, bukan sekadar pencemaran lingkungan itu sendiri."},
{t:"m",q:"Dalam rangka menjaga kebinekaan, kerja sama dan toleransi merupakan konsep yang sangat penting dalam membangun hubungan yang harmonis dan damai antara individu, kelompok, dan masyarakat. Kerjasama dapat dilakukan dalam berbagai bidang, seperti ekonomi, politik, sosial, dan budaya untuk meningkatkan efisiensi, efektivitas, dan kualitas hasil kerja. Sedangkan toleransi dilakukan dalam rangka membangun hubungan yang harmonis dan damai antara individu dan kelompok yang berbeda.\n\nBerdasarkan ilustrasi tersebut, mana saja pernyataan berikut yang menunjukkan upaya menjaga kebinekaan untuk menjadi modal sosial pembangunan nasional?",o:["Meningkatkan kualitas hidup masyarakat melalui pembangunan yang berbasis pada kebutuhan dan aspirasi masyarakat, sehingga masyarakat dapat merasa sejahtera dan bahagia.","Meningkatkan kreativitas dan inovasi melalui pertukaran ide dan pengalaman antar kelompok masyarakat, sehingga dapat mempromosikan pembangunan yang inovatif dan efektif.","Membantu meningkatkan interaksi dan pemahaman antara budaya yang berbeda serta kerja sama seni dan budaya dalam rangka meningkatkan penghargaan terhadap budaya lain.","Meningkatkan kesadaran dan rasa tanggung jawab masyarakat terhadap pembangunan nasional, sehingga masyarakat dapat merasa memiliki dan bertanggung jawab terhadap masa depan bangsa.","Menjalin kerja sama seni dan budaya dapat membantu meningkatkan penghargaan terhadap budaya serta penggunaan teknologi yang dapat meningkatkan komunikasi dan interaksi antara budaya yang berbeda."],a:[1,2,4],e:"Upaya menjaga kebinekaan sebagai modal sosial ditunjukkan oleh pertukaran ide antarkelompok, interaksi dan pemahaman antarbudaya, serta kerja sama seni-budaya yang meningkatkan penghargaan terhadap budaya lain. Pilihan pertama dan keempat berbicara tentang kesejahteraan dan rasa tanggung jawab pembangunan secara umum, bukan upaya menjaga kebinekaan."},
{t:"m",q:"Menjelang pemilu serentak, pemerintah dan berbagai organisasi mengadakan sosialisasi untuk pemilih pemula di tingkat SMA. Reza seorang siswa kelas XII mengikuti kegiatan sosialisasi tersebut. Ia belajar pentingnya mengenali visi misi calon wakil rakyat, menghindari politik uang, dan menggunakan hak pilih dengan bijak. Reza juga mengajak teman-temannya untuk ikut serta dalam pemilu sebagai wujud tanggung jawab warga negara.\n\nBerdasarkan ilustrasi tersebut, pernyataan manakaah yang menunjukkan tujuan partisipasi pemilih pemula seperti Reza dalam pesta demokrasi?",o:["Memberikan suara untuk menentukan pemimpin yang membawa perubahan positif.","Menunjukkan jati diri sebagai pelajar yang bertanggung jawab terhadap masa depan.","Membangun kesadaran para pemilih pemula untuk terlibat dalam proses pemilihan.","Menolak segala bentuk politik uang dan memilih berdasarkan kepentingan kelompok.","Menggunakan hak pilih seseuai hati nurani dengan mempertimbangkan kompetensi pemimpin."],a:[0,2,4],e:"Tujuan partisipasi pemilih pemula: memilih pemimpin yang membawa perubahan positif, membangun kesadaran untuk terlibat dalam pemilu, dan memakai hak pilih sesuai hati nurani dengan menimbang kompetensi calon. Pilihan menolak politik uang benar secara sikap, tetapi frasa 'berdasarkan kepentingan kelompok' bertentangan dengan memilih secara bijak dan objektif."},
{t:"s",q:"Sejak 1957, Indonesia telah mengirim lebih dari 30.000 personel TNI ke berbagai negara konflik sebagai bagian dari misi perdamaian dunia. Peran serta Indonesia ini merupakan perwujudan nilai Pancasila dan amanat Pembukaan UUD NRI Tahun 1945 untuk mewujudkan perdamaian berdasarkan kemerdekaan, perdamaian abadi, dan keadilan sosial.\n\nKeunggulan nilai Pancasila dalam peran tersebut adalah....",o:["mewujudkan solidaritas kemanusiaan melalui politik luar negeri bebas aktif","menunjukkan komitmen terhadap nilai persatuan dalam kerja sama internasional","menerapkan keadilan sosial dengan mewujudkan perdamaian di kancah global","memperkuat posisi Indonesia dalam persaingan geopolitik khususnya kawasan asia","mewujudkan tujuan nasional dengan berupaya menjaga kepentingan strategis global"],a:[2],e:"Pembukaan UUD 1945 mengamanatkan ikut melaksanakan ketertiban dunia berdasarkan kemerdekaan, perdamaian abadi, dan keadilan sosial. Misi perdamaian dunia adalah penerapan nilai Keadilan Sosial (Sila Kelima) di tingkat global."},
];
const DURASI=60*60;
const L="ABCDE";
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TYPE={s:"Pilihan Ganda",m:"Pilihan Ganda Kompleks (Jawaban benar lebih dari satu)",k:"Pilihan Ganda Kompleks (Benar / Salah)"};
let S={nama:"",kelas:"",nis:"",sekolah:""},ans=[],doubt=[],cur=0,end=0,timer=null,finished=false;

function init(){ans=QUESTIONS.map(q=>q.t=="s"?null:q.t=="m"?[]:q.s.map(()=>null));doubt=QUESTIONS.map(()=>false);cur=0;finished=false;}
function start(){
  $("#app").innerHTML=`<div class="wrap">
  <div class="hero grad"><h1>🎓 Try Out TKA</h1><p>Pendidikan Pancasila (Pilihan) · SMA/MA/SMK Tahun 2025</p>
  <div class="tags"><span class="tag">${QUESTIONS.length} soal</span><span class="tag">⏱ ${DURASI/60} menit</span><span class="tag">3 tipe soal</span></div></div>
  <div class="card"><h2>Identitas Peserta</h2>
  <div class="grid2"><div><label for="n">Nama Siswa</label><input type="text" id="n" autocomplete="off" placeholder="Nama lengkap"></div>
  <div><label for="k">Kelas</label><input type="text" id="k" autocomplete="off" placeholder="Contoh: XII IPA 1"></div>
  <div><label for="p">Peserta Didik (NIS / No. Peserta)</label><input type="text" id="p" autocomplete="off" placeholder="Nomor induk / peserta"></div>
  <div><label for="s">Asal Sekolah</label><input type="text" id="s" autocomplete="off" placeholder="Nama sekolah"></div></div>
  <div class="err" id="er"></div>
  <p class="note">Petunjuk: jawab semua soal, gunakan tombol <b>Ragu-ragu</b> untuk menandai soal yang ingin diperiksa lagi. Waktu berjalan otomatis setelah ujian dimulai dan ujian berakhir sendiri saat waktu habis.</p>
  <button class="btn" id="go" style="margin-top:10px">Mulai Try Out →</button></div></div>`;
  $("#go").onclick=()=>{
    const v={nama:$("#n").value.trim(),kelas:$("#k").value.trim(),nis:$("#p").value.trim(),sekolah:$("#s").value.trim()};
    if(!v.nama||!v.kelas||!v.nis||!v.sekolah){$("#er").textContent="Mohon lengkapi semua data terlebih dahulu.";return;}
    S=v;init();end=Date.now()+DURASI*1000;exam();timer=setInterval(tick,1000);tick();};
}
function fmt(t){const m=Math.floor(t/60),s=t%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
function tick(){const r=Math.max(0,Math.round((end-Date.now())/1000));const el=$("#tm");if(el){el.textContent=fmt(r);el.classList.toggle("low",r<=300);}if(r<=0)finish();}
function isDone(i){const q=QUESTIONS[i],a=ans[i];return q.t=="s"?a!==null:q.t=="m"?a.length>0:a.every(x=>x!==null);}
function exam(){
  $("#app").innerHTML=`<div class="top grad"><div><b>${esc(S.nama)}</b><small>${esc(S.kelas)} · ${esc(S.sekolah)}</small></div><div class="timer" id="tm">--:--</div></div>
  <div class="wrap"><div class="layout"><div class="card" id="qc"></div>
  <div class="card nav"><h2>Navigasi Soal</h2><div class="navg" id="ng"></div>
  <div class="leg"><span><i style="background:var(--ok)"></i>Sudah dijawab</span><span><i style="background:var(--warn)"></i>Ragu-ragu</span><span><i style="background:var(--idle)"></i>Belum dijawab</span></div>
  <button class="btn go" id="fin" style="width:100%;margin-top:16px">Selesai &amp; Kumpulkan</button></div></div></div><div id="md"></div>`;
  $("#fin").onclick=confirmFinish;render();
}
function render(){
  const q=QUESTIONS[cur];let h=`<div class="qhead"><h2 style="margin:0">Soal ${cur+1} <span style="color:var(--mut);font-weight:400">/ ${QUESTIONS.length}</span></h2><span class="badge">${TYPE[q.t]}</span></div><div class="qtext">${esc(q.q)}</div>`;
  if(q.t=="s")h+=q.o.map((o,i)=>`<div class="opt ${ans[cur]===i?"sel":""}" data-i="${i}" role="radio" aria-checked="${ans[cur]===i}" tabindex="0"><b>${L[i]}</b><span>${esc(o)}</span></div>`).join("");
  else if(q.t=="m")h+=`<p class="note" style="margin-top:0">Pilih semua jawaban yang benar.</p>`+q.o.map((o,i)=>`<div class="opt ${ans[cur].includes(i)?"sel":""}" data-i="${i}" role="checkbox" aria-checked="${ans[cur].includes(i)}" tabindex="0"><b>${ans[cur].includes(i)?"✓":L[i]}</b><span>${esc(o)}</span></div>`).join("");
  else h+=`<div style="overflow-x:auto"><table><tr><th>Pernyataan</th><th class="c">Benar</th><th class="c">Salah</th></tr>`+q.s.map((s,i)=>`<tr><td>${esc(s)}</td><td class="c"><input type="radio" name="r${i}" data-i="${i}" data-v="1" ${ans[cur][i]===true?"checked":""}></td><td class="c"><input type="radio" name="r${i}" data-i="${i}" data-v="0" ${ans[cur][i]===false?"checked":""}></td></tr>`).join("")+`</table></div>`;
  h+=`<div class="acts"><button class="btn ghost" id="pv" ${cur==0?"disabled":""}>← Sebelumnya</button><button class="btn warn" id="db">${doubt[cur]?"✔ Batal Ragu-ragu":"Ragu-ragu"}</button>${cur<QUESTIONS.length-1?`<button class="btn" id="nx">Selanjutnya →</button>`:`<button class="btn go" id="nx">Selesai ✓</button>`}</div>`;
  $("#qc").innerHTML=h;
  document.querySelectorAll(".opt").forEach(e=>{const f=()=>pick(+e.dataset.i);e.onclick=f;e.onkeydown=ev=>{if(ev.key==" "||ev.key=="Enter"){ev.preventDefault();f();}};});
  document.querySelectorAll("input[type=radio]").forEach(e=>e.onchange=()=>{ans[cur][+e.dataset.i]=e.dataset.v=="1";nav();});
  $("#pv").onclick=()=>go(cur-1);$("#db").onclick=()=>{doubt[cur]=!doubt[cur];render();};
  $("#nx").onclick=()=>cur<QUESTIONS.length-1?go(cur+1):confirmFinish();nav();
}
function pick(i){const q=QUESTIONS[cur];if(q.t=="s")ans[cur]=i;else{const a=ans[cur],k=a.indexOf(i);k<0?a.push(i):a.splice(k,1);}render();}
function go(i){cur=i;render();window.scrollTo({top:0,behavior:"smooth"});}
function nav(){$("#ng").innerHTML=QUESTIONS.map((_,i)=>`<button class="nb ${doubt[i]?"doubt":isDone(i)?"done":""} ${i==cur?"cur":""}" data-i="${i}">${i+1}</button>`).join("");document.querySelectorAll(".nb").forEach(b=>b.onclick=()=>go(+b.dataset.i));}
function confirmFinish(){
  const nd=QUESTIONS.filter((_,i)=>!isDone(i)).length,rg=doubt.filter(Boolean).length;
  $("#md").innerHTML=`<div class="modal"><div class="card" style="max-width:420px"><h2>Kumpulkan jawaban?</h2><p>Belum dijawab: <b>${nd}</b> soal<br>Ditandai ragu-ragu: <b>${rg}</b> soal</p><div class="acts"><button class="btn ghost" id="c1">Kembali</button><button class="btn go" id="c2">Ya, Kumpulkan</button></div></div></div>`;
  $("#c1").onclick=()=>$("#md").innerHTML="";$("#c2").onclick=finish;
}
function score(i){const q=QUESTIONS[i],a=ans[i];
  if(q.t=="s")return a===q.a[0]?1:0;
  if(q.t=="m"){const r=a.filter(x=>q.a.includes(x)).length,w=a.length-r;return Math.max(0,(r-w)/q.a.length);}
  return q.a.filter((v,k)=>a[k]===v).length/q.a.length;}
function ansText(i,u){const q=QUESTIONS[i],a=u?ans[i]:q.a;
  if(q.t=="s")return a===null?"Tidak dijawab":`${L[u?a:a[0]]}. ${q.o[u?a:a[0]]}`;
  if(q.t=="m")return a.length?[...a].sort().map(x=>`${L[x]}. ${q.o[x]}`).join("<br>"):"Tidak dijawab";
  return q.s.map((s,k)=>`${k+1}. ${esc(s).slice(0,70)}… → <b>${a[k]===null?"-":a[k]?"Benar":"Salah"}</b>`).join("<br>");}
function finish(){
  if(finished)return;finished=true;clearInterval(timer);
  const sc=QUESTIONS.map((_,i)=>score(i)),tot=sc.reduce((a,b)=>a+b,0),nilai=Math.round(tot/QUESTIONS.length*1000)/10;
  const full=sc.filter(x=>x===1).length,part=sc.filter(x=>x>0&&x<1).length,zero=QUESTIONS.length-full-part;
  const pred=nilai>=80?"Sangat Baik 🏆":nilai>=65?"Baik 👍":nilai>=50?"Cukup 🙂":"Perlu Belajar Lagi 📚";
  const col=nilai>=65?"var(--ok)":nilai>=50?"var(--warn)":"var(--no)";
  let h=`<div class="wrap"><div class="hero grad" style="text-align:center"><h1>Hasil Try Out TKA</h1><p>Pendidikan Pancasila (Pilihan) · SMA/MA/SMK 2025</p></div>
  <div class="card"><div class="ring" style="background:conic-gradient(${col} ${nilai*3.6}deg,var(--idle) 0)"><div><div><strong>${nilai}</strong><span>Nilai Akhir</span></div></div></div>
  <h2 style="text-align:center;margin-top:14px">${pred}</h2>
  <div class="info"><div><small>Nama</small><b>${esc(S.nama)}</b></div><div><small>Kelas</small><b>${esc(S.kelas)}</b></div><div><small>Peserta Didik</small><b>${esc(S.nis)}</b></div><div><small>Asal Sekolah</small><b>${esc(S.sekolah)}</b></div></div>
  <div class="stats"><span class="stat" style="background:var(--okbg)">✔ Benar penuh: ${full}</span><span class="stat" style="background:var(--warnbg)">◐ Sebagian: ${part}</span><span class="stat" style="background:var(--nobg)">✘ Salah / kosong: ${zero}</span></div>
  <p class="note">Skor: pilihan ganda 1 poin; pilihan ganda kompleks dinilai proporsional (jawaban benar dikurangi jawaban salah, minimum 0). Nilai = total poin ÷ ${QUESTIONS.length} × 100.</p>
  <div class="acts noprint"><button class="btn" onclick="window.print()">🖨 Cetak / Simpan PDF</button><button class="btn ghost" onclick="start()">↻ Ulangi Try Out</button></div></div>
  <h2 style="margin:20px 4px 10px">Pembahasan Soal</h2>`;
  QUESTIONS.forEach((q,i)=>{const c=sc[i]===1?"ok":sc[i]>0?"part":"bad";
    h+=`<div class="card rv ${c}"><div class="qhead"><b>Soal ${i+1}</b><span class="badge">${TYPE[q.t].split(" (")[0]}${q.t!="s"?" Kompleks":""} · ${sc[i]===1?"Benar":sc[i]>0?"Sebagian benar":"Salah"}</span></div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="ans u"><small>Jawaban kamu</small><br>${ansText(i,true)}</div><div class="ans k"><small>Kunci jawaban</small><br>${ansText(i,false)}</div>
    <div class="exp"><b>Pembahasan:</b> ${esc(q.e)}</div></div>`;});
  h+=`<p class="note">Catatan: file soal tidak memuat kunci jawaban, dan soal nomor 21 dibuat sebagai pengganti karena tidak tersedia di file, sehingga kunci dan pembahasan di atas disusun berdasarkan analisis materi. Mohon diverifikasi oleh guru sebelum dipakai sebagai acuan resmi.</p></div>`;
  $("#app").innerHTML=h;window.scrollTo(0,0);
}
start();
</script>
</body>
</html>
